name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: world
          MYSQL_USER: appuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/world
      DB_USER: appuser
      DB_PASSWORD: testpassword

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Import World database
        env:
          MYSQL_PWD: testpassword
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=appuser world < database/world.sql
          mysql --host=127.0.0.1 --port=3306 --user=appuser world -e "SELECT COUNT(*) FROM country;"

      - name: Run unit and integration tests
        run: mvn --batch-mode clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn

      - name: Build Docker image
        run: docker build -t set08103-coursework:ci .
